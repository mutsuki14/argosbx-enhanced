name: Deploy command generator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - generator-enhanced.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check generator and collect static assets
        run: |
          node --check generator-enhanced.js
          node tests/test_generator.js
          mkdir -p _site
          cp index.html generator-enhanced.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
