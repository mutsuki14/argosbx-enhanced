name: Deploy command generator to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - generator-enhanced.js
      - generator-ui.js
      - styles.css
      - connection-tools.js
      - connection-ui.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check generator and collect static assets
        run: |
          node --check generator-enhanced.js
          node --check generator-ui.js
          node --check connection-tools.js
          node --check connection-ui.js
          node tests/test_generator.js
          node tests/test_connection.js
          mkdir -p _site
          cp index.html generator-enhanced.js generator-ui.js connection-tools.js connection-ui.js styles.css _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
